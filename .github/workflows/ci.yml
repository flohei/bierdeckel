name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Jede Änderung braucht einen Eintrag in CHANGELOG.md – außer der PR hat das Label „kein-changelog“.
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'kein-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md geändert?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE" HEAD | grep -qx CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Bitte einen Eintrag unter „## Unveröffentlicht“ ergänzen (oder Label „kein-changelog“ setzen)."
            exit 1
          fi
          .github/scripts/changelog.sh notes | grep -q . || { echo "::error file=CHANGELOG.md::„Unveröffentlicht“ ist leer."; exit 1; }
